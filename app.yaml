command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# On-behalf-of-user (OBO) authentication: the app receives the logged-in user's OAuth
# token via the X-Forwarded-Access-Token header and uses it for user-facing Databricks
# calls (Unity Catalog reads, Genie), so they run with the user's own permissions.
# Background/shared work (Lakebase write-back) stays on the service principal.
user_authorization:
  scopes:
    - sql              # SQL Statement API: promotion/calendar/scenario reads
    - sql.warehouses   # Warehouse list/start
    - catalog.catalogs # Unity Catalog: list catalogs
    - catalog.schemas  # Unity Catalog: list schemas
    - catalog.tables   # Unity Catalog: list tables + columns
    - dashboards.genie # Genie space: conversations, query results

resources:
  - name: promo-planner-db
    type: database
    config:
      instance: lakebase-demo
      database: promo_planner

env:
  # Run user-facing Databricks calls as the logged-in user once consent is confirmed.
  # Service-principal mode: all Databricks calls run as the app SP, which has been
  # granted warehouse CAN_USE, UC SELECT on promo_planning, and Genie CAN_RUN. This
  # avoids per-user OAuth re-consent for the demo. Flip to "true" for on-behalf-of-user.
  - name: OBO_ENABLED
    value: "false"
  # Lakebase (write-back) connection — instance + database resolved from the resource above.
  - name: LAKEBASE_INSTANCE
    value: "lakebase-demo"
  - name: PGHOST
    valueFrom: promo-planner-db
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "promo_planner"
  - name: PGSSLMODE
    value: "require"
  # Unity Catalog location of the RGM promotion data (read by server/routes/promos.py).
  - name: PROMO_CATALOG
    value: "serverless_razks1_catalog"
  - name: PROMO_SCHEMA
    value: "promo_planning"
  # SQL warehouse used for all Unity Catalog reads.
  - name: PROMO_WAREHOUSE_ID
    value: "efe860484f99f5a3"
