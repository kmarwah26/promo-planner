command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# On-behalf-of-user (OBO) authentication: the app receives the logged-in user's OAuth
# token via the X-Forwarded-Access-Token header and uses it for user-facing Databricks
# calls (Unity Catalog reads/writes), so they run with the user's own permissions.
# Background/shared work (Lakebase sandbox write-back) stays on the service principal.
user_authorization:
  scopes:
    - sql              # SQL Statement API: grid reads, submit MERGE, approve UPDATE
    - sql.warehouses   # Warehouse list/start
    - catalog.catalogs # Unity Catalog: list catalogs
    - catalog.schemas  # Unity Catalog: list schemas
    - catalog.tables   # Unity Catalog: list tables + columns

resources:
  - name: promo-planner-db
    type: database
    config:
      instance: lakebase-demo
      database: promo_planner

env:
  # Run user-facing Databricks calls as the logged-in user once consent is confirmed.
  # Service-principal mode: all Databricks calls run as the app SP, which has been
  # granted warehouse CAN_USE, UC SELECT on promo_planning, and Genie CAN_RUN. This
  # avoids per-user OAuth re-consent for the demo. Flip to "true" for on-behalf-of-user.
  - name: OBO_ENABLED
    value: "false"
  # Lakebase (write-back) connection — instance + database resolved from the resource above.
  - name: LAKEBASE_INSTANCE
    value: "lakebase-demo"
  - name: PGHOST
    valueFrom: promo-planner-db
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "promo_planner"
  - name: PGSSLMODE
    value: "require"
  # Unity Catalog location of the wholesale pricing data (read by server/routes/pricing.py).
  - name: PROMO_CATALOG
    value: "serverless_razks1_catalog"
  - name: PROMO_SCHEMA
    value: "promo_planning"
  # SQL warehouse used for all Unity Catalog reads and the submit/approve writes.
  - name: PROMO_WAREHOUSE_ID
    value: "efe860484f99f5a3"

# Scale-to-zero: planning runs in bursts (Commercial Directors edit for a stretch,
# then the plan is finalized and the app sits idle). Databricks Apps stop compute when
# idle and cold-start on the next request, so the app "scales down to zero" between
# planning cycles. Keep no always-on background loops; the Lakebase sandbox holds
# in-progress edits across restarts. Set the app's compute to the smallest size that
# meets the low-latency ask, and rely on idle auto-stop rather than a running instance.
